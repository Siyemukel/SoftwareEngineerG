<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Numeraid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-blue: #4B68A5;
            --color-light-grey: #f4f4f9;
            --color-metallic-silver: #9ca3af;
            --color-dark-grey: #6b7280;
            --color-deep-purple: #7c3aed;
            --color-teal: #0d9488;
            --color-green: #16a34a;
            --font-primary: 'Bebas Neue', cursive;
            --font-secondary: 'Open Sans', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center py-8 px-4">
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg overflow-hidden">
        <!-- Progress Bar -->
        <div class="w-full bg-gray-300 h-2">
            <div id="progress-bar" class="h-2 bg-blue-600 transition-all duration-300 ease-in-out" style="width: 0%"></div>
        </div>

        <div class="md:flex">
            <!-- Sidebar - Left Column -->
            <div class="md:w-2/5 bg-blue-600 p-8 text-white">
                <div class="text-center md:text-left mb-8">
                    <h2 class="text-3xl font-bold font-primary mb-4">Get Started</h2>
                </div>

                <div id="sidebar-steps" class="space-y-6">
                    <!-- Steps will be dynamically inserted here -->
                </div>
            </div>

            <!-- Form Content - Right Column -->
            <div id="form-content" class="md:w-3/5 p-8">
                <!-- Content will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentStep = 0;
            const steps = [
                { title: 'Welcome', description: "Let's get you started with our platform" },
                { title: 'Privacy Concern', description: 'Your data, your choice' },
                { title: 'All Done', description: "You're all set to begin!" },
            ];

            const formContent = document.getElementById('form-content');
            const progressBar = document.getElementById('progress-bar');
            const sidebarSteps = document.getElementById('sidebar-steps');

            let consent = false;

            const updateUI = () => {
                // Update progress bar
                progressBar.style.width = `${(currentStep / (steps.length - 1)) * 100}%`;

                // Update sidebar steps
                sidebarSteps.innerHTML = '';
                steps.forEach((step, index) => {
                    const isActive = currentStep === index;
                    const isCompleted = currentStep > index;

                    const stepDiv = document.createElement('div');
                    stepDiv.className = 'flex items-start';

                    const stepNumberDiv = document.createElement('div');
                    stepNumberDiv.className = `w-6 h-6 rounded-full flex items-center justify-center mr-3 mt-0.5 text-sm font-bold ${
                        isCompleted
                            ? 'bg-teal-500 text-white'
                            : isActive
                                ? 'bg-white text-blue-600'
                                : 'bg-gray-400 text-white'
                    }`;
                    stepNumberDiv.innerText = isCompleted ? '✓' : (index + 1);

                    const stepTextDiv = document.createElement('div');
                    stepTextDiv.className = `flex-1 ${isActive ? 'text-white' : 'text-blue-100'}`;
                    stepTextDiv.innerHTML = `
                        <p class="font-medium">${step.title}</p>
                        <p class="text-sm mt-1">${step.description}</p>
                    `;

                    stepDiv.appendChild(stepNumberDiv);
                    stepDiv.appendChild(stepTextDiv);
                    sidebarSteps.appendChild(stepDiv);
                });

                // Render current step content
                formContent.innerHTML = '';
                let stepContent = '';

                if (currentStep === 0) {
                    stepContent = `
                        <div class="max-w-md mx-auto">
                            <h1 class="text-3xl font-bold text-blue-600 mb-4 font-primary uppercase">Welcome to Numeraid</h1>
                            <p class="text-gray-600 mb-6 text-lg">
                                Numeraid is your digital companion for overcoming dyscalculia and building confidence with numbers.
                                We offer step-by-step help, personalized practice, and a supportive space to make math less stressful
                                and more accessible for everyone.
                            </p>
                            <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1740&q=80"
                                 alt="Welcome illustration"
                                 class="w-full h-48 object-cover rounded-lg mb-6" />
                            <button id="next-step" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 cursor-pointer">
                                Get Started
                            </button>
                        </div>
                    `;
                } else if (currentStep === 1) {
                    stepContent = `
                        <div class="max-w-md mx-auto">
                            <h1 class="text-2xl font-bold text-gray-800 mb-4">Privacy Concern</h1>
                            <p class="text-gray-600 mb-4">
                                We care about your privacy. Your assessment results and progress are yours.
                            </p>
                            <p class="text-gray-600 mb-6">
                                By checking this box, you <span class="font-semibold">consent</span> to securely share your assessment results with academic staff for personalized support and analytics. You can revoke this consent at any time.
                            </p>
                            <div class="flex items-start gap-3 mb-8">
                                <input type="checkbox" id="consent-checkbox" class="mt-1 w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                                <label for="consent-checkbox" class="text-gray-700">
                                    I consent to share my information with academic staff.
                                </label>
                            </div>
                            <div class="flex justify-between">
                                <button id="prev-step" class="bg-white hover:bg-gray-100 text-blue-600 font-medium py-3 px-6 rounded-lg border border-gray-300 transition duration-200 cursor-pointer">
                                    Back
                                </button>
                                <button id="next-step" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition duration-200 cursor-pointer">
                                    Continue
                                </button>
                            </div>
                        </div>
                    `;
                } else if (currentStep === 2) {
                    stepContent = `
                        <form method="POST" class="max-w-md mx-auto">
                            <div class="text-center">
                                <div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </div>
                                <h1 class="text-2xl font-bold text-gray-800 mb-4">All Set!</h1>
                                <p class="text-gray-600 mb-8">
                                    You're all ready to start your assessment. Good luck!
                                </p>
                                <div class="flex justify-center gap-4">
                                    <button id="prev-step" type="button" class="bg-white hover:bg-gray-100 text-blue-600 font-medium py-3 px-6 rounded-lg border border-gray-300 transition duration-200 cursor-pointer">
                                        Back
                                    </button>
                                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition duration-200 cursor-pointer">
                                        Continue to Survey
                                    </button>
                                </div>
                            </div>
                        </form>
                    `;
                }

                formContent.innerHTML = stepContent;
                addEventListeners();
            };

            const addEventListeners = () => {
                const nextButton = formContent.querySelector('#next-step');
                if (nextButton) {
                    nextButton.addEventListener('click', handleNextStep);
                }
                const prevButton = formContent.querySelector('#prev-step');
                if (prevButton) {
                    prevButton.addEventListener('click', handlePrevStep);
                }
                if (currentStep === 1) {
                    const consentCheckbox = formContent.querySelector('#consent-checkbox');
                    consentCheckbox.addEventListener('change', (e) => {
                        consent = e.target.checked;
                        // You can now store 'consent' status in your backend or session
                        console.log('Consent status:', consent);
                    });
                }
            };

            const handleNextStep = () => {
                if (currentStep < steps.length - 1) {
                    currentStep++;
                    updateUI();
                }
            };

            const handlePrevStep = () => {
                if (currentStep > 0) {
                    currentStep--;
                    updateUI();
                }
            };

            updateUI();
        });
    </script>
</body>
</html>
